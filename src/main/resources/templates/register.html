<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark lg">LR</span>
            <h1>Create your student account</h1>
            <p>Register to submit laboratory resource complaints.</p>
        </div>

        <div class="alert alert-error" th:if="${registerError}" role="alert">
            <span th:text="${registerError}">Error</span>
        </div>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate data-loading>
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" th:field="*{name}" autocomplete="name"
                       placeholder="Jane Doe" maxlength="100" required/>
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" th:field="*{email}" autocomplete="email"
                       placeholder="you@college.edu" maxlength="150" required/>
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="new-password"
                       placeholder="At least 6 characters" minlength="6" maxlength="100" required/>
                <p class="field-hint">Minimum 6 characters.</p>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-loading-text="Creating account…">Create account</button>
        </form>

        <p class="auth-alt">
            Already registered? <a th:href="@{/login}">Sign in</a>
        </p>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
